<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <!-- Oxford Belt and Book Crest -->
  <g transform="translate(10, 6)">
    <circle cx="20" cy="24" r="20" fill="#002147"/>
    <circle cx="20" cy="24" r="16" fill="none" stroke="#FFFFFF" stroke-width="1.5"/>
    <!-- Open Book (Dominus Illuminatio Mea) -->
    <path d="M12 20 q8 -3 16 0 v8 q-8 -3 -16 0 Z" fill="#FFFFFF"/>
    <path d="M20 18 v8" stroke="#002147" stroke-width="1"/>
    <!-- 3 Crowns -->
    <path d="M15 15 l2 2 l3 -4 l3 4 l2 -2 v2 h-10 Z" fill="#D4AF37"/>
    <path d="M21 15 l2 2 l3 -4 l3 4 l2 -2 v2 h-10 Z" fill="#D4AF37"/>
    <path d="M18 30 l2 2 l3 -4 l3 4 l2 -2 v2 h-10 Z" fill="#D4AF37"/>
  </g>
  <text x="56" y="27" font-family="'Cinzel', 'Times New Roman', serif" font-size="11" font-weight="700" fill="#002147" letter-spacing="0.08em">UNIVERSITY OF</text>
  <text x="56" y="44" font-family="'Cinzel', 'Times New Roman', serif" font-size="16" font-weight="900" fill="#002147" letter-spacing="0.06em">OXFORD</text>
</svg>
