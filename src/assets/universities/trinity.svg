  <text x="56" y="43" font-family="'Helvetica Neue', Arial, sans-serif" font-size="8.5" font-weight="600" fill="#C59B27" letter-spacing="0.08em">COLÁISTE NA TRÍONÓIDE, BAILE ÁTHA CLIATH</text>
